<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11192c">
  <meta name="description" content="在 3D 浮空賽道控制小球，穿過窄橋和斜坡，挑戰最佳時間。">
  <title>浮空滾球 | come to play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" tabindex="-1" aria-label="浮空滾球">
    <div id="view" aria-hidden="true"></div>
    <header class="hud">
      <a class="pill home" href="../../portal/">‹ 遊戲大廳</a>
      <div class="identity">
        <h1>浮空滾球</h1>
        <label class="level-label"><span class="sr-only">選擇關卡</span><select id="level"></select></label>
      </div>
      <button class="pill" id="restart" type="button" disabled>↻ 重開</button>
    </header>
    <section class="scores" aria-label="本局成績">
      <div><span>時間</span><output id="time">0.00</output></div>
      <div><span>最佳</span><output id="best">—</output></div>
      <div><span>檢查點</span><output id="progress">—</output></div>
    </section>
    <p id="status" class="status" role="status">載入 3D 場景中…</p>
    <section class="controls" aria-label="操作">
      <div id="joystick" class="joystick" aria-label="觸控搖桿" hidden>
        <span id="stick"></span>
      </div>
      <p class="hint" id="hint">方向鍵／WASD 移動 · 空白鍵煞車</p>
      <button class="brake pill" id="brake" type="button" hidden>煞車</button>
    </section>
    <dialog id="result" aria-labelledby="result-title">
      <h2 id="result-title">抵達終點！</h2>
      <p id="result-time"></p>
      <div class="actions">
        <button class="pill" id="retry" type="button">再玩一次</button>
        <button class="pill primary" id="next" type="button">下一關</button>
      </div>
    </dialog>
    <noscript><p class="status">請開啟 JavaScript 後再進入遊戲。</p></noscript>
  </main>
  <script src="../../portal/player.js"></script>
  <script type="module">
    import('./game.mjs').catch(error => {
      console.error(error);
      document.querySelector('#status').textContent = '無法載入 3D 場景。請確認網路連線後重新整理。';
    });
  </script>
</body>
</html>
