<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="come to play 網頁遊戲大廳。直接開玩 2048，探索益智、3D 和棋類遊戲。">
  <title>come to play | 遊戲大廳</title>
  <link rel="stylesheet" href="styles.css">
  <script src="games.js" defer></script>
  <script src="portal.js" defer></script>
</head>
<body>
  <header class="bar">
    <button id="menu" class="icon" type="button" aria-controls="sidebar" aria-label="遊戲分類" aria-expanded="false">☰</button>
    <a class="brand" href="./" aria-label="come to play 首頁"><span aria-hidden="true">▶</span> come to play</a>
    <search><label><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜尋遊戲" aria-label="搜尋遊戲"></label></search>
    <button id="settings" class="icon" type="button" aria-label="設定">⚙</button>
  </header>
  <div class="layout">
    <aside id="sidebar" aria-label="遊戲分類"></aside>
    <main id="main">
      <section class="hero" aria-labelledby="featured-title">
        <div class="hero-copy">
          <p class="eyebrow">精選遊戲</p>
          <h1 id="featured-title">2048</h1>
          <p class="intro">滑動方塊，讓相同數字合在一起。<br>你能拼出 2048 嗎？</p>
          <a class="play" data-game="2048" href="https://kuo-2048.family-kuo.chatgpt.site/">開始玩</a>
        </div>
        <div class="art" aria-hidden="true">
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <div class="tile tile-four">4</div><div class="tile tile-eight">8</div>
          <div class="tile tile-main">2048</div><div class="tile tile-sixteen">16</div>
        </div>
      </section>
      <section id="recent" hidden aria-label="繼續玩"></section>
      <div id="catalog"></div>
      <noscript><p>開啟 JavaScript 即可使用搜尋和分類。</p></noscript>
    </main>
  </div>
  <dialog id="preferences" aria-labelledby="preferences-title">
    <form method="dialog">
      <h2 id="preferences-title">大廳設定</h2>
      <label for="theme">外觀</label>
      <select id="theme">
        <option value="light">淺色</option>
        <option value="dark">深色</option>
        <option value="system">跟隨系統</option>
      </select>
      <button class="play">完成</button>
    </form>
  </dialog>
</body>
</html>
